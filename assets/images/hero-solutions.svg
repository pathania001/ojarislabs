<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="From challenge to outcome transformation" fill="none">
  <defs>
    <linearGradient id="solG" x1="80" y1="300" x2="520" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A00"/><stop offset=".4" stop-color="#F72585"/><stop offset=".7" stop-color="#8B3DFF"/><stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
    <radialGradient id="solGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8B3DFF" stop-opacity="0.42"/><stop offset="1" stop-color="#030817" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="solCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9D5FF"/><stop offset="0.45" stop-color="#8B3DFF"/><stop offset="1" stop-color="#168BFF"/>
    </radialGradient>
    <filter id="solBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <ellipse cx="300" cy="300" rx="270" ry="200" fill="url(#solGlow)"/>
  <!-- challenge: fragmented blocks (left) -->
  <g opacity="0.9">
    <rect x="70" y="230" width="42" height="42" rx="8" stroke="#FF8A00" stroke-width="3" transform="rotate(-8 91 251)"/>
    <rect x="60" y="300" width="42" height="42" rx="8" stroke="#F72585" stroke-width="3" transform="rotate(6 81 321)"/>
    <rect x="95" y="360" width="42" height="42" rx="8" stroke="#FF8A00" stroke-width="3" transform="rotate(-4 116 381)"/>
  </g>
  <!-- flow paths to core -->
  <g stroke="url(#solG)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M130 251 C 200 251, 210 300, 260 300"/>
    <path d="M120 321 C 200 321, 210 300, 260 300"/>
    <path d="M150 381 C 210 381, 215 305, 260 305"/>
  </g>
  <!-- core -->
  <circle cx="300" cy="300" r="72" fill="url(#solCore)" filter="url(#solBlur)" opacity="0.6"/>
  <circle cx="300" cy="300" r="54" fill="url(#solCore)"/>
  <circle cx="300" cy="300" r="54" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- outcome: aligned rising bars (right) -->
  <g stroke="url(#solG)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M340 300 C 390 300, 400 300, 440 300"/>
    <path d="M340 300 C 390 300, 410 250, 450 250"/>
    <path d="M340 300 C 390 300, 410 350, 450 350"/>
  </g>
  <g>
    <rect x="452" y="360" width="26" height="60" rx="5" fill="#168BFF"/>
    <rect x="486" y="330" width="26" height="90" rx="5" fill="#8B3DFF"/>
    <rect x="520" y="290" width="26" height="130" rx="5" fill="#F72585"/>
  </g>
  <path d="M452 250 l70 -30" stroke="#FF8A00" stroke-width="3" stroke-linecap="round"/>
  <path d="M512 214 l14 -4 -4 14" stroke="#FF8A00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g fill="#FFFFFF" opacity="0.6"><circle cx="300" cy="140" r="2.2"/><circle cx="300" cy="470" r="2"/><circle cx="200" cy="180" r="1.8"/></g>
</svg>
