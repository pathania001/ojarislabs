<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Connected communication signals" fill="none">
  <defs>
    <linearGradient id="conG" x1="150" y1="450" x2="450" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A00"/><stop offset=".4" stop-color="#F72585"/><stop offset=".7" stop-color="#8B3DFF"/><stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
    <radialGradient id="conGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#168BFF" stop-opacity="0.4"/><stop offset="1" stop-color="#030817" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="300" r="250" fill="url(#conGlow)"/>
  <!-- signal rings -->
  <g stroke="url(#conG)" fill="none" opacity="0.5">
    <circle cx="300" cy="300" r="110" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="170" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="300" cy="300" r="230" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>
  <!-- message paths -->
  <g stroke="url(#conG)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M300 300 C 220 240, 170 210, 130 190"/>
    <path d="M300 300 C 390 250, 440 220, 480 200"/>
    <path d="M300 300 C 240 380, 200 420, 160 450"/>
    <path d="M300 300 C 380 380, 420 420, 460 450"/>
  </g>
  <!-- endpoint message bubbles -->
  <g>
    <g transform="translate(96 158)"><rect width="64" height="46" rx="12" fill="#FF8A00"/><path d="M18 46 l0 16 16 -16z" fill="#FF8A00"/></g>
    <g transform="translate(446 168)"><rect width="64" height="46" rx="12" fill="#8B3DFF"/><path d="M46 46 l0 16 -16 -16z" fill="#8B3DFF"/></g>
    <circle cx="150" cy="452" r="16" fill="#F72585"/>
    <circle cx="456" cy="452" r="16" fill="#00C9D8"/>
  </g>
  <!-- core -->
  <circle cx="300" cy="300" r="40" fill="url(#conG)"/>
  <circle cx="300" cy="300" r="40" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M282 296 l18 12 18 -12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="280" y="288" width="40" height="26" rx="5" stroke="#FFFFFF" stroke-width="3" fill="none"/>
</svg>
