<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Connected services ecosystem" fill="none">
  <defs>
    <linearGradient id="svcG" x1="140" y1="460" x2="460" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A00"/><stop offset=".35" stop-color="#F72585"/><stop offset=".68" stop-color="#8B3DFF"/><stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
    <radialGradient id="svcGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B3DFF" stop-opacity="0.5"/><stop offset="0.5" stop-color="#168BFF" stop-opacity="0.18"/><stop offset="1" stop-color="#030817" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="svcCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A8"/><stop offset="0.4" stop-color="#FF8A00"/><stop offset="1" stop-color="#F72585"/>
    </radialGradient>
    <filter id="svcBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <circle cx="300" cy="300" r="250" fill="url(#svcGlow)"/>
  <circle cx="300" cy="300" r="150" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="300" cy="300" r="210" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
  <!-- connectors -->
  <g stroke="url(#svcG)" stroke-width="2" stroke-opacity="0.55">
    <line x1="300" y1="300" x2="300" y2="90"/>
    <line x1="300" y1="300" x2="448" y2="152"/>
    <line x1="300" y1="300" x2="510" y2="300"/>
    <line x1="300" y1="300" x2="448" y2="448"/>
    <line x1="300" y1="300" x2="300" y2="510"/>
    <line x1="300" y1="300" x2="152" y2="448"/>
    <line x1="300" y1="300" x2="90" y2="300"/>
    <line x1="300" y1="300" x2="152" y2="152"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="300" cy="90" r="20" fill="#FF8A00"/>
    <circle cx="448" cy="152" r="18" fill="#F72585"/>
    <circle cx="510" cy="300" r="20" fill="#8B3DFF"/>
    <circle cx="448" cy="448" r="18" fill="#168BFF"/>
    <circle cx="300" cy="510" r="20" fill="#00C9D8"/>
    <circle cx="152" cy="448" r="18" fill="#F72585"/>
    <circle cx="90" cy="300" r="20" fill="#168BFF"/>
    <circle cx="152" cy="152" r="18" fill="#FF8A00"/>
  </g>
  <!-- core -->
  <circle cx="300" cy="300" r="70" fill="url(#svcCore)" filter="url(#svcBlur)" opacity="0.6"/>
  <circle cx="300" cy="300" r="52" fill="url(#svcCore)"/>
  <circle cx="300" cy="300" r="52" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <g fill="#FFFFFF" opacity="0.7"><circle cx="200" cy="120" r="2.4"/><circle cx="470" cy="220" r="2"/><circle cx="120" cy="380" r="2.2"/><circle cx="420" cy="500" r="2"/></g>
</svg>
